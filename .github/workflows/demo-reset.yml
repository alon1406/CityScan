name: Nightly demo reset

# Returns the public demo to its seeded state.
#
# Visitors can file reports, change statuses and delete hazards, and uploaded photos
# accumulate on a small disk. Without this the map drifts into whatever the last
# visitor left behind.
#
# Runs here rather than in n8n because the demo host is an Azure B1s with 1 GB of RAM.
# n8n alone wants ~400 MB, which would not leave room for the backend, the AI service
# and the proxy. GitHub Actions costs nothing on a public repository and the backend
# endpoint is identical either way — see docs/demo-reset-schedule.md.

on:
  # The nightly schedule is deliberately absent until the backend is deployed.
  #
  # It was here, set to '0 1 * * *', and it failed every night from 11 August 2026:
  # there is no backend to reset yet, so DEMO_RESET_URL and DEMO_RESET_TOKEN are not
  # set as repository secrets and the guard below exits 1 within nine seconds. A job
  # scheduled against a server that does not exist is not a broken job — it is a job
  # that should not have been scheduled.
  #
  # Restore it in the same commit that sets the two secrets (see stage 3.4):
  #
  #   schedule:
  #     # 01:00 UTC — 04:00 in Israel in summer, 03:00 in winter. A quiet hour either
  #     # way, which is the point: a reset should never land mid-session while someone
  #     # is looking at the demo.
  #     - cron: '0 1 * * *'

  # Lets you reset by hand right before showing the project to someone. Kept enabled:
  # once the secrets exist this is how you verify the endpoint before trusting the cron.
  workflow_dispatch:

# Never let two resets overlap. A second run while the first is mid-wipe would seed
# on top of a half-cleared database.
concurrency:
  group: demo-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Reset demo data
        env:
          RESET_URL: ${{ secrets.DEMO_RESET_URL }}
          RESET_TOKEN: ${{ secrets.DEMO_RESET_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${RESET_URL:-}" ] || [ -z "${RESET_TOKEN:-}" ]; then
            echo "::error::DEMO_RESET_URL and DEMO_RESET_TOKEN must be set as repository secrets."
            exit 1
          fi

          # -sS keeps curl quiet but still prints errors. The body goes to a file so a
          # failure can be reported without the token ever reaching the log.
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 \
            --retry 3 --retry-delay 10 --retry-connrefused \
            -X POST "$RESET_URL" \
            -H "X-Demo-Reset-Token: $RESET_TOKEN")

          if [ "$status" != "200" ]; then
            echo "::error::Reset failed with HTTP $status"
            cat response.json || true
            exit 1
          fi

          echo "Reset succeeded:"
          cat response.json
          echo ""

      - name: Summary
        if: always()
        run: |
          if [ -f response.json ]; then
            {
              echo "### Demo reset"
              echo ''
              echo '```json'
              cat response.json
              echo ''
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
